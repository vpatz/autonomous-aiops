# Internal HTTP access to each guest; keep the VM name in client telemetry.
apiVersion: v1
kind: Service
metadata:
  name: rhel10-service-1-http
spec:
  selector:
    kubevirt.io/domain: rhel10-service-1
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
