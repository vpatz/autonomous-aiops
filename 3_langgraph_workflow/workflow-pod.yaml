  state.py: |
    #!/usr/bin/env python3
    """Shared state and node names for the LangGraph multi-agent workflow.

    The workflow is a LangGraph StateGraph over WorkflowState:

        START -> anomaly_detector -> root_cause_analyzer (inner loop, iterates
                 through MCP tools) -> remediation_selector -> remediation_executor
                 -> anomaly_detector (outer loop, verifies the remediation) -> END

    `investigation` and `findings` are append-only lists (operator.add reducers):
    every root-cause iteration and every agent decision is kept as an audit trail
    for the dashboard and the demo narrative.

    Verify:

        python3 3_langgraph_workflow/state.py --self-check
    """

    import operator
    import time
    from datetime import datetime, timedelta, timezone
    from typing import Annotated, TypedDict

    STEP = "workflow state"

    # LangGraph node names.
    NODE_DETECTOR = "anomaly_detector"
    NODE_RCA = "root_cause_analyzer"
    NODE_SELECTOR = "remediation_selector"
    NODE_EXECUTOR = "remediation_executor"

    # Workflow statuses.
    STATUS_HEALTHY = "healthy"
    STATUS_INVESTIGATING = "investigating"
    STATUS_REMEDIATING = "remediating"
    STATUS_REMEDIATED = "remediated"
    STATUS_FAILED = "failed"
    STATUS_NO_ACTION = "no_remediation_needed"

    DEFAULT_WINDOW_SECONDS = 120
    LLM_EVIDENCE_SECONDS = 10
    DEFAULT_SILENCE_SECONDS = 10
    DEFAULT_MAX_ITERATIONS = 25
    DEFAULT_MAX_ATTEMPTS = 3
    DEFAULT_POLL_SECONDS = 10
    DEFAULT_COOLDOWN_SECONDS = 120
    DEFAULT_VERIFY_WAIT_SECONDS = 30


    def utc_timestamp():
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


    IST = timezone(timedelta(hours=5, minutes=30), "IST")


    def ist_timestamp(when=None):
        """Human-facing log time; stored OTLP and API instants remain UTC."""
        when = datetime.fromisoformat(when.replace("Z", "+00:00")) if when else datetime.now(IST)
        return when.astimezone(IST).strftime("%Y-%m-%d %H:%M:%S IST")


    class WorkflowState(TypedDict, total=False):
        """State shared by every agent node in the graph."""

        service_name: str
        window_seconds: int
        telemetry: dict
        anomaly: dict
        detector_evidence: dict  # transient snapshot for the RCA inner loop
        investigation: Annotated[list, operator.add]
        root_cause: dict
        vm_halted: bool
        remediation: dict
        remediation_result: dict
        findings: Annotated[list, operator.add]
        attempts: int
        max_attempts: int
        iteration: int
        max_iterations: int
        verify_since: float
        incident_since: float
        status: str


    def initial_state(
        service_name,
        window_seconds=DEFAULT_WINDOW_SECONDS,
        telemetry=None,
        max_iterations=DEFAULT_MAX_ITERATIONS,
        max_attempts=DEFAULT_MAX_ATTEMPTS,
    ):
        return {
            "service_name": service_name,
            "window_seconds": window_seconds,
            "telemetry": telemetry or {},
            "anomaly": {},
            "investigation": [],
            "root_cause": {},
            "remediation": {},
            "remediation_result": {},
            "findings": [],
            "attempts": 0,
            "max_attempts": max_attempts,
            "iteration": 0,
            "max_iterations": max_iterations,
            "verify_since": 0.0,
            "status": STATUS_INVESTIGATING,
        }


    def self_check():
        state = initial_state("vm-1")
        expected = {
            "service_name": "vm-1",
            "window_seconds": DEFAULT_WINDOW_SECONDS,
            "attempts": 0,
            "iteration": 0,
            "status": STATUS_INVESTIGATING,
        }
        for key, value in expected.items():
            if state.get(key) != value:
                raise SystemExit(f"{STEP}: expected {key}={value}, got {state.get(key)}")
        # The append-only channels must reduce with operator.add so that each
        # inner-loop iteration adds to the audit trail instead of replacing it.
        if state["investigation"] + [{"tool": "x"}] != [{"tool": "x"}]:
            raise SystemExit(f"{STEP}: investigation must be a list")
        if not hasattr(operator, "add"):
            raise SystemExit(f"{STEP}: operator.add missing")
        for node in (NODE_DETECTOR, NODE_RCA, NODE_SELECTOR, NODE_EXECUTOR):
            if not isinstance(node, str) or not node:
                raise SystemExit(f"{STEP}: bad node name {node}")
        print(f"{STEP}: self-check ok", flush=True)


    def main():
        import argparse

        parser = argparse.ArgumentParser(description="Shared workflow state")
        parser.add_argument("--self-check", action="store_true")
        args = parser.parse_args()
        if not args.self_check:
            raise SystemExit("pass --self-check; the workflow imports this module")
        self_check()


    if __name__ == "__main__":
        main()
  agent_tracing.py: |
    """Optional MLflow spans for an incident, its agent invocations and its LLM calls."""

    from contextlib import contextmanager
    from contextvars import ContextVar
    from functools import wraps
    import logging
    import os
    import threading
    import time

    _root = ContextVar("aiops_mlflow_root", default=None)
    _lock = threading.Lock()
    _ready = False
    _log = logging.getLogger(__name__)


    def _client():
        global _ready
        import mlflow

        with _lock:
            if not _ready:
                mlflow.set_experiment(os.environ.get("MLFLOW_EXPERIMENT_NAME", "aiops-workflow"))
                _ready = True
        return mlflow


    @contextmanager
    def span(name, inputs, *, workflow=False):
        """Instrumentation errors never suppress or repeat workflow actions."""
        outputs = {}
        parent = _root.get()
        live = None
        if os.environ.get("MLFLOW_TRACKING_URI") and (workflow or parent is not None):
            try:
                live = _client().start_span_no_context(
                    name=name, span_type="CHAIN" if workflow else "AGENT",
                    parent_span=None if workflow else parent, inputs=inputs,
                    tags={"aiops.vm": inputs["service"]} if workflow else None,
                )
            except Exception as exc:
                _log.warning("MLflow could not start %s (%s)", name, type(exc).__name__)
        token = _root.set(live) if live is not None else None
        try:
            yield outputs
        except BaseException as exc:
            outputs["error_type"] = type(exc).__name__
            raise
        finally:
            if token is not None:
                _root.reset(token)
            if live is not None:
                try:
                    failed = "error_type" in outputs or outputs.get("status") == "failed"
                    live.end(outputs=outputs, status="ERROR" if failed else "OK")
                except Exception as exc:
                    _log.warning("MLflow could not finish %s (%s)", name, type(exc).__name__)


    @contextmanager
    def llm_span(service, phase, inputs=None):
        """One LLM call nested under the current agent span.

        Shows the call's live status ("in-flight" until it settles), duration,
        finish reason, token usage and the prompt messages (the caller truncates
        them to the span budget; MLflow caps span tags at 8000 characters).
        """
        outputs = {"service": service, "phase": phase}
        outputs.update(inputs or {})
        parent = _root.get()
        live = None
        if os.environ.get("MLFLOW_TRACKING_URI") and parent is not None:
            try:
                live = _client().start_span_no_context(
                    name=f"llm {phase}", span_type="LLM", parent_span=parent,
                    inputs=dict(outputs), tags={"aiops.vm": service} if service else None,
                )
            except Exception as exc:
                _log.warning("MLflow could not start llm %s (%s)", phase, type(exc).__name__)
        try:
            yield outputs
        except BaseException as exc:
            outputs.setdefault("status", "failed")
            outputs["error_type"] = type(exc).__name__
            raise
        finally:
            if live is not None:
                try:
                    failed = ("error_type" in outputs
                              or str(outputs.get("status", "")).startswith("failed"))
                    live.end(outputs=outputs, status="ERROR" if failed else "OK")
                except Exception as exc:
                    _log.warning("MLflow could not finish llm %s (%s)", phase, type(exc).__name__)


    def snippet(text, limit=2000):
        """Compact tool output for span recording (MLflow caps tags at 8000 chars)."""
        text = (text or "").strip().replace("\n", " | ")
        return text if len(text) <= limit else text[:limit] + "…[truncated]"


    @contextmanager
    def tool_span(tool, arguments):
        """One MCP tool call nested under the current agent span.

        Records the tool name, its arguments, an output snippet, status and
        duration; a no-op without MLflow or a parent span.
        """
        outputs = {"tool": tool, "arguments": arguments or {}}
        parent = _root.get()
        live = None
        if os.environ.get("MLFLOW_TRACKING_URI") and parent is not None:
            try:
                live = _client().start_span_no_context(
                    name=f"tool {tool}", span_type="TOOL", parent_span=parent,
                    inputs=dict(outputs),
                )
            except Exception as exc:
                _log.warning("MLflow could not start tool %s (%s)", tool, type(exc).__name__)
        started = time.monotonic()
        try:
            yield outputs
        except BaseException as exc:
            outputs.setdefault("status", "failed")
            outputs["error_type"] = type(exc).__name__
            raise
        finally:
            outputs["duration_ms"] = round((time.monotonic() - started) * 1000)
            if live is not None:
                try:
                    failed = ("error_type" in outputs
                              or str(outputs.get("status", "")).startswith("failed"))
                    live.end(outputs=outputs, status="ERROR" if failed else "OK")
                except Exception as exc:
                    _log.warning("MLflow could not finish tool %s (%s)", tool, type(exc).__name__)


    def agent(name):
        def decorate(node):
            @wraps(node)
            def traced(state):
                # Record decisions, not raw state (journal output or credentials);
                # LLM prompts are captured in their own nested spans instead.
                inputs = {"service": state["service_name"], "iteration": state.get("iteration", 0),
                          "attempts": state.get("attempts", 0)}
                with span(name, inputs) as out:
                    command = node(state)
                    update = command.update
                    out["next"] = command.goto
                    for key in ("status", "iteration", "attempts"):
                        if key in update:
                            out[key] = update[key]
                    if "anomaly" in update:
                        out["signals"] = update["anomaly"].get("signals", [])
                    if "investigation" in update:
                        out["tools"] = [item.get("tool") for item in update["investigation"]]
                    if "root_cause" in update:
                        out["component"] = update["root_cause"].get("component")
                        out["confidence"] = update["root_cause"].get("confidence")
                    if "remediation" in update:
                        out["plan"] = [step.get("tool") for step in update["remediation"]["plan"]]
                    if "remediation_result" in update:
                        out["accepted"] = update["remediation_result"].get("ok")
                    return command
            return traced
        return decorate
  llm.py: |
    #!/usr/bin/env python3
    """OpenAI-compatible chat client for the workflow agents.

    Works with any /v1/chat/completions endpoint: vLLM on a GPU node, EnMaaS,
    OpenAI, and so on. Configure with:

        LLM_BASE_URL   e.g. https://enmaas.example.com/v1 (include /v1)
        LLM_API_KEY    bearer token (optional for local vLLM)
        LLM_MODEL      optional override for the default Muse Spark model

    Every agent falls back to deterministic heuristics when the LLM is not
    configured or a call fails, so the demo always runs.

    Verify (no network needed):

        python3 3_langgraph_workflow/llm.py --self-check

    Probe a live endpoint:

        python3 3_langgraph_workflow/llm.py --probe
    """

    import argparse
    import json
    import os
    import re
    import threading
    import time
    import urllib.error
    import urllib.request
    import agent_tracing
    from state import ist_timestamp

    STEP = "llm client"
    DEFAULT_MODEL = "rits/meta-models/Muse-Spark-Open-816B-A42B-NVFP4"
    VM_CALL_INTERVAL = 10
    CALL_START_GAP = 5
    DEFAULT_PROMPT_SPAN_CHARS = 7000  # MLflow caps a span-tag value at 8000 chars


    def prompt_span_budget():
        """Character budget for prompts recorded in MLflow spans (0 disables)."""
        try:
            return max(0, int(os.environ.get("LLM_PROMPT_SPAN_CHARS", str(DEFAULT_PROMPT_SPAN_CHARS))))
        except ValueError:
            return DEFAULT_PROMPT_SPAN_CHARS


    def _message_text(message):
        content = message.get("content", "") if isinstance(message, dict) else ""
        return content if isinstance(content, str) else json.dumps(content)


    def _prompt_for_span(messages, budget):
        """Prompt copy for the MLflow span: full when it fits, truncated in place
        otherwise (with a visible marker — MLflow would otherwise cut the whole
        serialized input silently at its 8000-character span-tag limit)."""
        record, used, truncated = [], 0, False
        for message in messages:
            text = _message_text(message)
            remaining = budget - used
            if len(text) > remaining:
                cut = text[:max(remaining, 0)] + "…[truncated]"
                record.append({**message, "content": cut} if isinstance(message, dict)
                              else {"content": cut})
                used, truncated = budget, True
            else:
                record.append(message)
                used += len(text)
        return record, truncated


    class CallPacer:
        """Reserve start times against the actual clock; never lock during network I/O."""
        def __init__(self, clock=time.monotonic, sleep=time.sleep):
            self.clock, self.sleep = clock, sleep
            self.lock = threading.Lock()
            self.next_global = 0
            self.next_vm = {}

        def wait(self, vm):
            with self.lock:
                due = max(self.next_global, self.next_vm.get(vm, 0))
                while (delay := due - self.clock()) > 0:
                    self.sleep(delay)
                start = self.clock()
                self.next_global = start + CALL_START_GAP
                self.next_vm[vm] = start + VM_CALL_INTERVAL


    _pacer = CallPacer()


    class LlmError(Exception):
        pass


    class IncompleteReply(LlmError):
        """The model ran out of output tokens before returning usable JSON."""


    def config():
        return {
            "base_url": os.environ.get("LLM_BASE_URL", "").strip().rstrip("/"),
            "api_key": os.environ.get("LLM_API_KEY", "").strip(),
            "model": os.environ.get("LLM_MODEL", "").strip() or DEFAULT_MODEL,
        }


    def available():
        cfg = config()
        return bool(cfg["base_url"] and cfg["model"])


    def build_request(messages, tools=None, temperature=0.0, max_tokens=1024):
        cfg = config()
        payload = {
            "model": cfg["model"],
            "messages": messages,
            "temperature": temperature,
            "max_tokens": max_tokens,
        }
        if tools:
            payload["tools"] = tools
        headers = {"Content-Type": "application/json"}
        if cfg["api_key"]:
            headers["Authorization"] = f"Bearer {cfg['api_key']}"
        url = cfg["base_url"] + "/chat/completions"
        return urllib.request.Request(
            url, data=json.dumps(payload).encode(), headers=headers, method="POST"
        )


    def _report(service_name, phase, message):
        """One progress line per call state, so pod logs show where time goes."""
        if service_name is not None:
            print(f"[{ist_timestamp()}] [llm client] {service_name} {phase} {message}", flush=True)


    def chat(messages, tools=None, temperature=0.0, max_tokens=1024, service_name=None, phase="call"):
        """One chat completion. Returns {"content": str, "tool_calls": list}."""
        if not available():
            raise LlmError("LLM not configured (set LLM_BASE_URL)")
        model = config()["model"]
        request = build_request(messages, tools=tools, temperature=temperature, max_tokens=max_tokens)
        if service_name is not None:
            _pacer.wait(service_name)
            _report(service_name, phase, f"model call starting ({model})")
        started = time.monotonic()
        span_inputs = {"model": model, "max_tokens": max_tokens, "tools": len(tools or []),
                       "prompt_chars": sum(len(_message_text(m)) for m in messages)}
        budget = prompt_span_budget()
        if budget:
            span_inputs["messages"], truncated = _prompt_for_span(messages, budget)
            if truncated:
                span_inputs["prompt_truncated"] = True
        with agent_tracing.llm_span(service_name, phase, span_inputs) as record:
            record["status"] = "in-flight"
            try:
                with urllib.request.urlopen(request, timeout=120) as response:
                    body = json.loads(response.read().decode("utf-8", "replace"))
                record["status"] = "ok"
            except urllib.error.HTTPError as exc:
                record["status"] = f"failed: HTTP {exc.code}"
                _report(service_name, phase,
                        f"model call failed after {time.monotonic() - started:.1f}s "
                        f"(endpoint returned HTTP {exc.code})")
                raise LlmError(f"model endpoint returned HTTP {exc.code}") from exc
            except OSError as exc:
                record["status"] = f"failed: {type(exc).__name__}"
                _report(service_name, phase,
                        f"model call failed after {time.monotonic() - started:.1f}s "
                        f"(connection failed: {type(exc).__name__})")
                raise LlmError(f"model connection failed ({type(exc).__name__})") from exc
            finally:
                record["duration_ms"] = round((time.monotonic() - started) * 1000)
            try:
                choice = body["choices"][0]["message"]
            except (KeyError, IndexError, TypeError) as exc:
                record["status"] = "failed: no chat message in reply"
                raise LlmError("model endpoint returned no chat message") from exc
            finish_reason = body["choices"][0].get("finish_reason")
            record["finish_reason"] = finish_reason
            usage = body.get("usage") or {}
            tokens = {key: usage[key] for key in
                      ("prompt_tokens", "completion_tokens", "total_tokens") if key in usage}
            if tokens:
                record["tokens"] = tokens
            _report(service_name, phase,
                    f"model call finished in {time.monotonic() - started:.1f}s "
                    f"(finish_reason={finish_reason})")
        return {
            "content": choice.get("content") or "",
            "tool_calls": choice.get("tool_calls") or [],
            "finish_reason": finish_reason,
        }


    def _extract_json(text):
        """Parse a JSON object out of an LLM reply, tolerating code fences."""
        if not text:
            raise LlmError("empty LLM reply")
        stripped = text.strip()
        fence = re.search(r"```(?:json)?\s*(.*?)```", stripped, re.DOTALL)
        if fence:
            stripped = fence.group(1).strip()
        try:
            return json.loads(stripped)
        except ValueError:
            pass
        start, end = stripped.find("{"), stripped.rfind("}")
        if start >= 0 and end > start:
            try:
                return json.loads(stripped[start : end + 1])
            except ValueError:
                pass
        raise LlmError("model reply did not contain valid JSON")


    def chat_json(messages, temperature=0.0, max_tokens=1024, service_name=None, phase="decision"):
        """Chat completion parsed as a JSON object (agents use JSON decisions)."""
        reply = chat(messages, temperature=temperature, max_tokens=max_tokens,
                     service_name=service_name, phase=phase)
        try:
            return _extract_json(reply["content"])
        except LlmError as exc:
            _report(service_name, phase,
                    f"model reply was not usable JSON (finish_reason={reply.get('finish_reason')})")
            if reply.get("finish_reason") == "length":
                raise IncompleteReply(f"model reached the {max_tokens}-token output limit before returning JSON") from exc
            raise


    def self_check():
        import os

        now = [0]
        pacer = CallPacer(lambda: now[0], lambda delay: now.__setitem__(0, now[0] + delay))
        for vm, expected in [("a", 0), ("b", 5), ("b", 15), ("c", 20), ("a", 25)]:
            pacer.wait(vm)
            assert now[0] == expected

        saved = {key: os.environ.get(key) for key in ("LLM_BASE_URL", "LLM_API_KEY", "LLM_MODEL")}
        os.environ["LLM_BASE_URL"] = "https://llm.example.com/v1"
        os.environ.pop("LLM_API_KEY", None)
        try:
            os.environ.pop("LLM_MODEL", None)
            assert config()["model"] == DEFAULT_MODEL and available()
            os.environ["LLM_MODEL"] = "test-model"
            parsed = _extract_json('Sure! ```json\n{"detected": true, "score": 2}\n```')
            if parsed != {"detected": True, "score": 2}:
                raise SystemExit(f"{STEP}: fenced JSON not parsed: {parsed}")
            parsed = _extract_json('The answer is {"a": 1} hope that helps')
            if parsed != {"a": 1}:
                raise SystemExit(f"{STEP}: embedded JSON not parsed: {parsed}")
            try:
                _extract_json("no json here")
                raise SystemExit(f"{STEP}: garbage should not parse")
            except LlmError:
                pass
            request = build_request(
                [{"role": "user", "content": "hi"}],
            )
            if request.full_url != "https://llm.example.com/v1/chat/completions":
                raise SystemExit(f"{STEP}: bad request url {request.full_url}")
            data = json.loads(request.data.decode())
            if data["messages"][0]["content"] != "hi" or data["temperature"] != 0.0:
                raise SystemExit(f"{STEP}: bad request payload {data}")
            if data["model"] != "test-model":
                raise SystemExit(f"{STEP}: bad model in payload {data}")
            if "Authorization" in request.headers:
                raise SystemExit(f"{STEP}: auth header without api key")
            os.environ["LLM_API_KEY"] = "secret"
            request = build_request([{"role": "user", "content": "hi"}])
            if request.headers.get("Authorization") != "Bearer secret":
                raise SystemExit(f"{STEP}: bearer token not set")

            # chat(): each call records its status for MLflow and pod logs.
            import contextlib
            import sys
            from unittest.mock import patch

            this = sys.modules[__name__]  # patch the running module, not a second import
            captured = []

            @contextlib.contextmanager
            def fake_llm_span(service, phase, inputs=None):
                record = {"service": service, "phase": phase, **(inputs or {})}
                captured.append(record)
                yield record

            reply_body = {
                "choices": [{"message": {"content": '{"ok": true}'}, "finish_reason": "stop"}],
                "usage": {"prompt_tokens": 9, "completion_tokens": 2, "total_tokens": 11},
            }

            class FakeResponse:
                def __init__(self, body):
                    self._body = body

                def read(self):
                    return self._body

            def fake_urlopen(request, timeout=None):
                return contextlib.nullcontext(FakeResponse(json.dumps(reply_body).encode()))

            with patch.object(agent_tracing, "llm_span", fake_llm_span), \
                    patch.object(urllib.request, "urlopen", fake_urlopen), \
                    patch.object(this, "_pacer", pacer):
                reply = chat([{"role": "user", "content": "hi"}],
                             service_name="vm-9", phase="self-check")
            if reply["content"] != '{"ok": true}' or reply["finish_reason"] != "stop":
                raise SystemExit(f"{STEP}: chat reply wrong {reply}")
            record = captured[-1]
            if (record["phase"] != "self-check" or record["status"] != "ok"
                    or "duration_ms" not in record or record["finish_reason"] != "stop"
                    or record["tokens"]["total_tokens"] != 11):
                raise SystemExit(f"{STEP}: successful call status not recorded {record}")

            def refuse(request, timeout=None):
                raise urllib.error.HTTPError(request.full_url, 429, "too many requests", None, None)

            with patch.object(agent_tracing, "llm_span", fake_llm_span), \
                    patch.object(urllib.request, "urlopen", refuse), \
                    patch.object(this, "_pacer", pacer):
                try:
                    chat([{"role": "user", "content": "hi"}],
                         service_name="vm-9", phase="self-check")
                    raise SystemExit(f"{STEP}: HTTP failure should raise LlmError")
                except LlmError as exc:
                    if "429" not in str(exc):
                        raise SystemExit(f"{STEP}: HTTP failure should surface the code: {exc}")
            record = captured[-1]
            if (not str(record["status"]).startswith("failed") or "duration_ms" not in record):
                raise SystemExit(f"{STEP}: failed call status not recorded {record}")

            with patch.object(this, "chat",
                              return_value={"content": '{"a": 1}', "finish_reason": "stop"}) as fake:
                parsed = chat_json([{"role": "user", "content": "x"}],
                                   service_name="vm-9", phase="self-check")
            if parsed != {"a": 1} or fake.call_args.kwargs.get("phase") != "self-check":
                raise SystemExit(f"{STEP}: chat_json must pass phase through {fake.call_args}")

            # Prompts are recorded in the span, truncated visibly to the budget.
            record = captured[0]
            if record["messages"] != [{"role": "user", "content": "hi"}] or record["prompt_chars"] != 2:
                raise SystemExit(f"{STEP}: prompt not recorded in span {record}")
            with patch.dict(os.environ, {"LLM_PROMPT_SPAN_CHARS": "5"}), \
                    patch.object(agent_tracing, "llm_span", fake_llm_span), \
                    patch.object(urllib.request, "urlopen", fake_urlopen), \
