    def main():
        parser = argparse.ArgumentParser(description="Mock MCP server over stdio")
        parser.add_argument("--role", choices=["linux", "ansible"], default="linux")
        parser.add_argument("--self-check", action="store_true")
        args = parser.parse_args()
        if args.self_check:
            self_check()
            return
