            sample_metrics_payload("vm-1", {"dummy-crash": 1, "service.uptime": 26.0}), received_at=now - 20))
        store.record_metrics(parse_metrics(
            sample_metrics_payload("vm-1", {"dummy-crash": 1, "service.uptime": 31.0}), received_at=now - 10))
