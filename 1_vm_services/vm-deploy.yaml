apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel9-production-vm-1
  namespace: my-vm-project
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: rhel9-production-vm-1
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - dataVolume:
            name: rhel9-root-volume-1
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: rhel9-cloudinit
          name: cloudinitdisk
  dataVolumeTemplates:
    - metadata:
        name: rhel9-root-volume-1
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
          storageClassName: ocs-external-storagecluster-ceph-rbd
