apiVersion: v1
kind: Secret
metadata:
  name: rhel9-cloudinit
  namespace: my-vm-project
type: Opaque
stringData:
  userdata: |
    #cloud-config
    user: rheluser
    password: YourSecurePassword
    chpasswd: { expire: false }
    ssh_pwauth: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: wheel
    ssh_authorized_keys:
      - ssh-rsa  vpathang@vpathang-mac
    write_files:
      - path: /etc/yum.repos.d/ubi10.repo
        owner: root:root
        permissions: "0644"
        content: |
          [ubi-10-baseos-rpms]
          name=Red Hat Universal Base Image 10 (RPMs) - BaseOS
          baseurl=https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/x86_64/baseos/os
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

          [ubi-10-appstream-rpms]
          name=Red Hat Universal Base Image 10 (RPMs) - AppStream
          baseurl=https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/x86_64/appstream/os
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      - path: /opt/aiops/setup.sh
        owner: root:root
        permissions: "0755"
        content: |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/aiops-setup.log 2>&1
          dnf install -y git
          python3 -m venv --without-pip /opt/aiops/venv
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          /opt/aiops/venv/bin/python /tmp/get-pip.py
          /opt/aiops/venv/bin/python -m pip install --disable-pip-version-check \
            "flask==3.0.3" \
            "opentelemetry-api==1.41.1" \
            "opentelemetry-sdk==1.41.1" \
            "opentelemetry-exporter-otlp-proto-http==1.41.1" \
            "opentelemetry-instrumentation-flask==0.62b1"
          systemctl daemon-reload
          systemctl enable --now aiops-demo.service
      - path: /opt/aiops/start-service.sh
        owner: root:root
        permissions: "0755"
        content: |
          #!/bin/bash
          set -euxo pipefail
          rm -rf /opt/aiops/src
          git clone --depth 1 https://github.com/vpatz/autonomous-aiops.git /opt/aiops/src
          exec /opt/aiops/venv/bin/python /opt/aiops/src/1_vm_services/service.py
      - path: /etc/systemd/system/aiops-demo.service
        owner: root:root
        permissions: "0644"
        content: |
          [Unit]
          Description=AIOps demo service
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/aiops
          ExecStart=/opt/aiops/start-service.sh
          Restart=no

          [Install]
          WantedBy=multi-user.target
    runcmd:
      - /opt/aiops/setup.sh
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel10-service-1
  namespace: my-vm-project
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: rhel10-service-1
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - dataVolume:
            name: rhel10-root-volume-1
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: rhel9-cloudinit
          name: cloudinitdisk
  dataVolumeTemplates:
    - metadata:
        name: rhel10-root-volume-1
      spec:
        sourceRef:
          kind: DataSource
          name: rhel10
          namespace: openshift-virtualization-os-images
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
          storageClassName: ocs-external-storagecluster-ceph-rbd
---
