# The linux-mcp deployment mounts the linux-mcp-ssh secret. Create it
# out-of-band so the private key never lives in git:
#   ssh-keygen -t ed25519 -f mcp_id_ed25519 -C mcp@rhel
#   oc create secret generic linux-mcp-ssh -n my-vm-project \
#     --from-file=id_ed25519=mcp_id_ed25519
# Add the matching public key to ssh_authorized_keys in the rhel9-cloudinit
# userdata above before applying this manifest.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: linux-mcp-policy
  namespace: my-vm-project
data:
  policy.yaml: |
    rules:
      - all_users: true
        host: "*"
        tools: ["@fixed"]
        action: ssh_key
        ssh_key:
          path: /tmp/id_ed25519
          user: rheluser
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-mcp
  namespace: my-vm-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linux-mcp
  template:
    metadata:
      labels:
        app: linux-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linux-mcp-server
          image: quay.io/redhat-services-prod/rhel-lightspeed-tenant/linux-mcp-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /etc/linux-mcp-server/secret/id_ed25519 /tmp/id_ed25519
              chmod 600 /tmp/id_ed25519
              exec linux-mcp-server
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOME
              value: /tmp
            - name: LINUX_MCP_TRANSPORT
              value: http
            - name: LINUX_MCP_HOST
              value: 0.0.0.0
            - name: LINUX_MCP_PORT
              value: "8000"
            - name: LINUX_MCP_PATH
              value: /mcp
            - name: LINUX_MCP_HOST_MODE
              value: remote-only
            - name: LINUX_MCP_USER
              value: rheluser
            - name: LINUX_MCP_SSH_KEY_PATH
              value: /tmp/id_ed25519
            - name: LINUX_MCP_VERIFY_HOST_KEYS
              value: "false"
            - name: LINUX_MCP_LOG_OUTPUT
              value: stdout
            - name: LINUX_MCP_LOG_FORMAT
              value: json
            - name: LINUX_MCP_POLICY_PATH
              value: /etc/linux-mcp-server/policy.yaml
            - name: LINUX_MCP_ALLOWED_LOG_PATHS
              value: /var/log/messages,/var/log/secure
            - name: LINUX_MCP_BASE_URL
              value: https://linux-mcp-my-vm-project.apps.cluster-ptrsb.dyn.redhatworkshops.io
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/linux-mcp-server/secret
              readOnly: true
            - name: policy
              mountPath: /etc/linux-mcp-server/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ssh-key
          secret:
            secretName: linux-mcp-ssh
            defaultMode: 0444
        - name: policy
          configMap:
            name: linux-mcp-policy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: linux-mcp
  namespace: my-vm-project
spec:
  selector:
    app: linux-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: linux-mcp
  namespace: my-vm-project
spec:
  host: linux-mcp-my-vm-project.apps.cluster-ptrsb.dyn.redhatworkshops.io
  to:
    kind: Service
    name: linux-mcp
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
