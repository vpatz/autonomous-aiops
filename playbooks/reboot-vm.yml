---
- name: Reboot one KubeVirt demo VM from the controller execution pod
  hosts: aiops_vms
  connection: local
  gather_facts: false
  vars:
    api: https://kubernetes.default.svc
    namespace: my-vm-project
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ lookup('ansible.builtin.env', 'AIOPS_VM_CA_FILE') }}"
      follow_redirects: none
      headers:
        Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AIOPS_VM_TOKEN') }}"
  tasks:
    - name: Require exactly one allowlisted VM
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ansible_limit | default('') == inventory_hostname
          - inventory_hostname in ['rhel10-service-1', 'rhel10-service-2', 'rhel10-service-3', 'rhel10-service-4']
    - name: Check VM power state and wait for any transition to finish
      ansible.builtin.uri:
        url: "{{ api }}/apis/kubevirt.io/v1/namespaces/{{ namespace }}/virtualmachines/{{ inventory_hostname }}"
      register: vm
      until: vm.status == 200 and vm.json.status.printableStatus not in ['Stopping', 'Starting']
      retries: 60
      delay: 3
      no_log: true
    - name: Reboot a running VM (the controller recreates the VMI)
      ansible.builtin.uri:
        url: "{{ api }}/apis/subresources.kubevirt.io/v1/namespaces/{{ namespace }}/virtualmachines/{{ inventory_hostname }}/restart"
        method: PUT
        body_format: json
        body: {}
        status_code: [200, 202, 409]
      when: vm.json.status.printableStatus == 'Running'
      changed_when: true
      no_log: true
    - name: Start the VM instead when it was found halted
      ansible.builtin.uri:
        url: "{{ api }}/apis/subresources.kubevirt.io/v1/namespaces/{{ namespace }}/virtualmachines/{{ inventory_hostname }}/start"
        method: PUT
        body_format: json
        body: {}
        status_code: [200, 202, 409]
      when: vm.json.status.printableStatus == 'Stopped'
      changed_when: true
      no_log: true
