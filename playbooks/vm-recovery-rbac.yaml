---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-vm-recovery
  namespace: aap
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-vm-recovery-token
  namespace: aap
  annotations:
    kubernetes.io/service-account.name: aiops-vm-recovery
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-start-vm
  namespace: my-vm-project
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get"]
    resourceNames: &demo_vms [rhel10-service-1, rhel10-service-2, rhel10-service-3, rhel10-service-4]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/start"]
    verbs: ["update"]
    resourceNames: *demo_vms
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/restart"]
    verbs: ["update"]
    resourceNames: *demo_vms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-start-vm
  namespace: my-vm-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-start-vm
subjects:
  - kind: ServiceAccount
    name: aiops-vm-recovery
    namespace: aap
