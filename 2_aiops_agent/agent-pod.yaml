kind: ConfigMap
metadata:
  name: aiops-agent
  namespace: my-vm-project
data:
  aiops_agent.py: |
    #!/usr/bin/env python3
    """Run the three AIOps agent steps.

    1. receive_otel.py receives OTLP/HTTP metrics.
    2. analyze_metrics.py marks a service down when those metrics stop.
    3. call_eda.py posts a restart event for that service.

    Verify each step, then the pipeline:

        python3 2_aiops_agent/receive_otel.py --self-check
        python3 2_aiops_agent/analyze_metrics.py --self-check
        python3 2_aiops_agent/call_eda.py --dry-run
        python3 2_aiops_agent/aiops_agent.py --self-check
    """

    import html
    import sys
    import threading
    import time
    import urllib.error
    from datetime import datetime, timezone
    from pathlib import Path

    from http.server import ThreadingHTTPServer

    sys.path.insert(0, str(Path(__file__).resolve().parent))

    import analyze_metrics
    import call_eda
    import receive_otel
    from receive_otel import LISTEN_HOST, LISTEN_PORT

    SILENCE_SECONDS = analyze_metrics.SILENCE_SECONDS
    COOLDOWN_SECONDS = analyze_metrics.COOLDOWN_SECONDS
    DASHBOARD_PATHS = ("/", "/dashboard")


    class StatusBoard:
        def __init__(self):
            self._lock = threading.Lock()
            self.last_attempts = {}
            self.eda = {}

        def attempts(self):
            with self._lock:
                return dict(self.last_attempts)

        def note_attempt(self, service_name):
            with self._lock:
                self.last_attempts[service_name] = time.monotonic()

        def record_eda(self, service_name, action, result):
            with self._lock:
                previous = self.eda.get(service_name, {})
                self.eda[service_name] = {
                    "called": True,
                    "action": action,
                    "result": result,
                    "at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                    "count": previous.get("count", 0) + 1,
                }

        def eda_snapshot(self):
            with self._lock:
                return {name: dict(record) for name, record in self.eda.items()}


    def render_dashboard(store, board, silence_seconds, cooldown_seconds):
        exports = store.snapshot()
        decisions = {
            decision.service_name: decision
            for decision in analyze_metrics.analyze(
                exports,
                time.monotonic(),
                silence_seconds,
                cooldown_seconds,
                board.attempts(),
            )
        }
        eda = board.eda_snapshot()
        rows = []
        for service_name in sorted(exports):
            export = exports[service_name]
            decision = decisions[service_name]
            metrics = ", ".join(
                f"{html.escape(str(name))}={html.escape(str(value))}"
                for name, value in sorted(export.metrics.items())
            ) or "none"
            call = eda.get(service_name)
            if call is None:
                eda_cell = "not called"
            else:
                eda_cell = (
                    f"called {html.escape(call['action'])} "
                    f"({html.escape(call['result'])}) at {html.escape(call['at'])}, "
                    f"count {call['count']}"
                )
            rows.append(
                "<tr>"
                f"<td>{html.escape(service_name)}</td>"
                f"<td>{metrics}</td>"
                f"<td>{decision.silent_for:.0f}s ago</td>"
                f"<td>{html.escape(decision.status)}: {html.escape(decision.reason)}</td>"
                f"<td>{eda_cell}</td>"
                "</tr>"
            )
        body = (
            "<tr><td colspan=\"5\">No metrics collected yet.</td></tr>"
            if not rows
            else "\n".join(rows)
        )
        up = sum(1 for decision in decisions.values() if decision.status == "up")
        down = sum(1 for decision in decisions.values() if decision.status == "down")
        called = sum(1 for record in eda.values() if record.get("called"))
        return f"""<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta http-equiv="refresh" content="5">
      <title>AIOps agent</title>
      <style>
        body {{ font-family: "Segoe UI", Helvetica, Arial, sans-serif; margin: 2rem; background: #f4f6f8; color: #1f2933; }}
        main {{ max-width: 64rem; }}
        table {{ width: 100%; border-collapse: collapse; background: #fff; }}
        th, td {{ border: 1px solid #e2e8f0; padding: 0.6rem 0.8rem; text-align: left; vertical-align: top; }}
        th {{ background: #eef2f6; }}
      </style>
    </head>
    <body>
      <main>
        <h1>AIOps agent</h1>
        <p>{len(exports)} services, {up} up, {down} down, EDA called for {called}.</p>
        <table>
          <thead>
            <tr>
              <th>Service</th>
              <th>Collected metrics</th>
              <th>Last metric</th>
              <th>Analysis</th>
              <th>EDA</th>
            </tr>
          </thead>
          <tbody>
            {body}
          </tbody>
        </table>
      </main>
    </body>
    </html>
    """


    class AgentHandler(receive_otel.OtlpHandler):
        silence_seconds = SILENCE_SECONDS
        cooldown_seconds = COOLDOWN_SECONDS
        board = None

        def do_GET(self):
            if self.path.split("?", 1)[0] not in DASHBOARD_PATHS:
                self.send_error(404, "expected /dashboard")
                return
            page = render_dashboard(
                self.store,
                self.board,
                self.silence_seconds,
                self.cooldown_seconds,
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.send_header("Content-Length", str(len(page)))
            self.end_headers()
            self.wfile.write(page)

        def do_POST(self):
            super().do_POST()
            if self.path.split("?", 1)[0] not in ("/v1/metrics", "/"):
                return
            now = time.monotonic()
            for export in self.store.take_batch():
                decision = analyze_metrics.analyze(
                    {export.service_name: export},
                    now,
                    self.silence_seconds,
                    self.cooldown_seconds,
                    self.board.attempts(),
                )[0]
                analyze_metrics.log_analysis(decision)


    def watch_metrics(store, board, stop, url, username, password, silence_seconds, cooldown_seconds):
        last_status = {}
        while not stop.wait(1):
            decisions = analyze_metrics.analyze(
                store.snapshot(),
                time.monotonic(),
                silence_seconds,
                cooldown_seconds,
                board.attempts(),
            )
            for decision in decisions:
                previous = last_status.get(decision.service_name)
                last_status[decision.service_name] = decision.status
                if decision.status != "down":
                    continue
                if previous != "down" or decision.action:
                    analyze_metrics.log_analysis(decision)
                if not decision.action:
                    continue
                board.note_attempt(decision.service_name)
                try:
                    _status, _body = call_eda.call_eda(
                        url,
                        username,
                        password,
                        decision.action,
                        decision.service_name,
                    )
                except (OSError, urllib.error.URLError) as exc:
                    result = f"failed {exc}"
                    print(f"{call_eda.STEP}: {result}", flush=True)
                else:
                    result = f"accepted HTTP {_status}"
                board.record_eda(decision.service_name, decision.action, result)


    def self_check():
        receive_otel.self_check()
        analyze_metrics.self_check()
        call_eda.self_check()
        store = receive_otel.ExportStore()
        store.record(
            receive_otel.MetricExport(
                "rhel10-service-1",
                time.monotonic(),
                {"service.uptime": 3.0, "service.cpu.load": 1.2},
            )
        )
        board = StatusBoard()
        page = render_dashboard(store, board, SILENCE_SECONDS, COOLDOWN_SECONDS)
        for expected in ("rhel10-service-1", "service.uptime", "up", "not called"):
            if expected not in page:
                raise SystemExit(f"dashboard missing {expected}")
        board.record_eda("rhel10-service-1", "restart", "accepted HTTP 202")
        called = render_dashboard(store, board, SILENCE_SECONDS, COOLDOWN_SECONDS)
        if "called restart" not in called or "accepted HTTP 202" not in called:
            raise SystemExit("dashboard did not show the EDA call")
        print("aiops_agent: steps 1, 2, and 3 ok", flush=True)


    def main():
        import argparse

        parser = argparse.ArgumentParser(description="Receive metrics, analyze them, and call EDA")
        parser.add_argument("--self-check", action="store_true")
        parser.add_argument("--url", default=call_eda.DEFAULT_URL)
        parser.add_argument("--username", default=call_eda.DEFAULT_USERNAME)
        parser.add_argument("--password", default=call_eda.DEFAULT_PASSWORD)
        parser.add_argument("--silence-seconds", type=float, default=SILENCE_SECONDS)
        parser.add_argument("--cooldown-seconds", type=float, default=COOLDOWN_SECONDS)
        args = parser.parse_args()
        if args.self_check:
            self_check()
            return
        if not args.password:
            raise SystemExit("Set EDA_EVENT_PASSWORD or pass --password")

        store = receive_otel.ExportStore()
        board = StatusBoard()
        AgentHandler.store = store
        AgentHandler.board = board
        AgentHandler.silence_seconds = args.silence_seconds
        AgentHandler.cooldown_seconds = args.cooldown_seconds
        stop = threading.Event()
        watcher = threading.Thread(
            target=watch_metrics,
            args=(
                store,
                board,
                stop,
                args.url,
                args.username,
                args.password,
                args.silence_seconds,
                args.cooldown_seconds,
            ),
            daemon=True,
        )
        watcher.start()
        server = ThreadingHTTPServer((LISTEN_HOST, LISTEN_PORT), AgentHandler)
        print(
            f"aiops_agent: {receive_otel.STEP}; {analyze_metrics.STEP}; {call_eda.STEP}; "
            f"listening on {LISTEN_HOST}:{LISTEN_PORT}; dashboard at /dashboard",
            flush=True,
        )
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            print("aiops_agent: stopped", flush=True)
        finally:
            stop.set()
            server.server_close()


    if __name__ == "__main__":
        main()
  receive_otel.py: |
    #!/usr/bin/env python3
    """Step 1: receive OTLP/HTTP metrics.

    Verify without a cluster:

        python3 2_aiops_agent/receive_otel.py --self-check

    Listen for live metrics:

        python3 2_aiops_agent/receive_otel.py
    """

    import gzip
    import sys
    import threading
    import time
    from dataclasses import dataclass, field
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    sys.path.insert(0, str(Path(__file__).resolve().parent / "eda"))

    import receive_metrics
    from opentelemetry.proto.collector.metrics.v1.metrics_service_pb2 import (
        ExportMetricsServiceRequest,
        ExportMetricsServiceResponse,
    )

    LISTEN_HOST = receive_metrics.LISTEN_HOST
    LISTEN_PORT = receive_metrics.LISTEN_PORT
    STEP = "step 1 receive otel"


    @dataclass
    class MetricExport:
        service_name: str
        received_at: float
        metrics: dict = field(default_factory=dict)
        text: str = ""


    class ExportStore:
        def __init__(self):
            self._lock = threading.Lock()
            self._latest = {}
            self._batch = []

        def record(self, export):
            with self._lock:
                self._latest[export.service_name] = export
                self._batch.append(export)

        def snapshot(self):
            with self._lock:
                return dict(self._latest)

        def take_batch(self):
            with self._lock:
                batch = self._batch
                self._batch = []
                return batch


    def parse_otlp_body(payload, content_encoding=None, received_at=None):
        if content_encoding == "gzip":
            payload = gzip.decompress(payload)
        request = ExportMetricsServiceRequest()
        request.ParseFromString(payload)
        received_at = time.monotonic() if received_at is None else received_at
        text = receive_metrics._format_request(request)
        exports = []
        for resource_metrics in request.resource_metrics:
            service_name = receive_metrics._resource_name(resource_metrics.resource)
            metrics = {}
            for scope_metrics in resource_metrics.scope_metrics:
                for metric in scope_metrics.metrics:
                    kind = metric.WhichOneof("data")
                    body = getattr(metric, kind) if kind else None
                    if body is None or kind not in ("gauge", "sum"):
                        continue
                    points = list(body.data_points)
                    if not points:
                        continue
                    value = receive_metrics._number(points[-1])
                    if value is not None:
                        metrics[metric.name] = value
            exports.append(MetricExport(service_name, received_at, metrics, text))
        return exports


    def log_received(export):
        print(
            f"{STEP}: service={export.service_name} metrics={len(export.metrics)}",
            flush=True,
        )
        if export.text:
            print(export.text, flush=True)


    class OtlpHandler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        store = None

        def do_POST(self):
            if self.path.split("?", 1)[0] not in ("/v1/metrics", "/"):
                self.send_error(404, "expected /v1/metrics")
                return
            length = int(self.headers.get("Content-Length", "0"))
            payload = self.rfile.read(length)
            exports = parse_otlp_body(payload, self.headers.get("Content-Encoding"))
            if self.store is not None:
                for export in exports:
                    self.store.record(export)
            if not exports:
                print(f"{STEP}: empty metrics export", flush=True)
            else:
                for export in exports:
                    log_received(export)
            body = ExportMetricsServiceResponse().SerializeToString()
            self.send_response(200)
            self.send_header("Content-Type", "application/x-protobuf")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            return


    def sample_payload():
        request = ExportMetricsServiceRequest()
        resource_metrics = request.resource_metrics.add()
        attribute = resource_metrics.resource.attributes.add()
        attribute.key = "service.name"
        attribute.value.string_value = "self-check"
        metric = resource_metrics.scope_metrics.add().metrics.add()
        metric.name = "service.uptime"
        point = metric.gauge.data_points.add()
        point.as_double = 1.5
        return request.SerializeToString()


    def self_check():
        payload = sample_payload()
        exports = parse_otlp_body(payload, received_at=10.0)
        if len(exports) != 1:
            raise SystemExit(f"{STEP}: expected 1 export, got {len(exports)}")
        export = exports[0]
        if export.service_name != "self-check" or export.metrics.get("service.uptime") != 1.5:
            raise SystemExit(f"{STEP}: parsed export did not match {export}")
        store = ExportStore()
        store.record(export)
        if store.snapshot()["self-check"].metrics["service.uptime"] != 1.5:
            raise SystemExit(f"{STEP}: store did not keep the export")
        if store.take_batch()[0].service_name != "self-check" or store.take_batch():
            raise SystemExit(f"{STEP}: batch was not returned once")
        print(f"{STEP}: self-check ok", flush=True)


    def main():
        import argparse

        parser = argparse.ArgumentParser(description="Step 1: receive OTLP/HTTP metrics")
        parser.add_argument("--self-check", action="store_true")
        parser.add_argument("--host", default=LISTEN_HOST)
        parser.add_argument("--port", type=int, default=LISTEN_PORT)
        args = parser.parse_args()
        if args.self_check:
            self_check()
            return
        OtlpHandler.store = ExportStore()
        server = ThreadingHTTPServer((args.host, args.port), OtlpHandler)
        print(f"{STEP}: listening on {args.host}:{args.port}", flush=True)
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            print(f"{STEP}: stopped", flush=True)
        finally:
            server.server_close()


    if __name__ == "__main__":
        main()
  analyze_metrics.py: |
    #!/usr/bin/env python3
    """Step 2: decide whether a service needs a restart from the metrics it sent.

    A service is up when its latest export is newer than the silence window.
    A service that was seen and then goes quiet is down, and the restart action
    is returned once per cooldown.

    Verify:

        python3 2_aiops_agent/analyze_metrics.py --self-check
    """

    from dataclasses import dataclass

    STEP = "step 2 analyze metrics"
    SILENCE_SECONDS = 10
    COOLDOWN_SECONDS = 60


    @dataclass
    class Analysis:
        service_name: str
        status: str
        silent_for: float
        action: str
        reason: str


    def analyze(exports, now, silence_seconds, cooldown_seconds, last_attempts):
        decisions = []
        for service_name, export in exports.items():
            silent_for = now - export.received_at
            if silent_for < silence_seconds:
                decisions.append(
                    Analysis(
                        service_name,
                        "up",
                        silent_for,
                        "",
                        "metrics are arriving",
                    )
                )
                continue
            since_attempt = now - last_attempts.get(service_name, 0.0)
            action = "restart" if since_attempt >= cooldown_seconds else ""
            decisions.append(
                Analysis(
                    service_name,
                    "down",
                    silent_for,
                    action,
                    f"no metrics for {silent_for:.0f}s",
                )
            )
        return decisions


    def log_analysis(decision):
        action = decision.action or "none"
        print(
            f"{STEP}: service={decision.service_name} status={decision.status} "
            f"silent_for={decision.silent_for:.0f}s action={action} reason={decision.reason}",
            flush=True,
        )


    class _Export:
        def __init__(self, service_name, received_at):
            self.service_name = service_name
            self.received_at = received_at


    def self_check():
        now = 1000.0
        fresh = {"vm-1": _Export("vm-1", 995.0)}
        up = analyze(fresh, now, SILENCE_SECONDS, COOLDOWN_SECONDS, {})
        if len(up) != 1 or up[0].status != "up" or up[0].action:
            raise SystemExit(f"{STEP}: fresh metrics should be up, got {up}")

        stale = {"vm-1": _Export("vm-1", 980.0)}
        down = analyze(stale, now, SILENCE_SECONDS, COOLDOWN_SECONDS, {})
        if down[0].status != "down" or down[0].action != "restart":
            raise SystemExit(f"{STEP}: stale metrics should restart, got {down}")

        cooling = analyze(stale, now, SILENCE_SECONDS, COOLDOWN_SECONDS, {"vm-1": 990.0})
        if cooling[0].status != "down" or cooling[0].action:
            raise SystemExit(f"{STEP}: cooldown should suppress restart, got {cooling}")

        if analyze({}, now, SILENCE_SECONDS, COOLDOWN_SECONDS, {}):
            raise SystemExit(f"{STEP}: unknown services must not be restarted")

        print(f"{STEP}: self-check ok", flush=True)


    def main():
        import argparse

        parser = argparse.ArgumentParser(description="Step 2: analyze received metrics")
        parser.add_argument("--self-check", action="store_true")
        args = parser.parse_args()
        if not args.self_check:
            raise SystemExit("pass --self-check; the agent calls analyze() with live exports")
        self_check()


    if __name__ == "__main__":
        main()
  call_eda.py: |
    #!/usr/bin/env python3
    """Step 3: post a restart event to Event-Driven Ansible.

    Verify the request that would be sent, without contacting AAP:

        python3 2_aiops_agent/call_eda.py --dry-run

    Send a real event:

        EDA_EVENT_PASSWORD=... python3 2_aiops_agent/call_eda.py --service rhel10-service-1
    """

    import json
    import sys
    import urllib.error
    from pathlib import Path

    sys.path.insert(0, str(Path(__file__).resolve().parent / "eda"))

    from send_restart_event import DEFAULT_PASSWORD, DEFAULT_URL, DEFAULT_USERNAME, send_event

    STEP = "step 3 call eda"


    def event_payload(action, service_name):
        payload = {"action": action}
        if service_name:
            payload["service"] = service_name
        return payload


    def call_eda(url, username, password, action, service_name="", dry_run=False):
        payload = event_payload(action, service_name)
        print(
            f"{STEP}: service={service_name or '-'} action={action} url={url} "
            f"payload={json.dumps(payload)}",
            flush=True,
        )
        if dry_run:
            print(f"{STEP}: dry-run ok", flush=True)
            return 0, "dry-run"
        status, body = send_event(url, username, password, action, service_name)
        print(f"{STEP}: accepted HTTP {status}", flush=True)
        if body.strip():
            print(body, flush=True)
        return status, body


    def self_check():
        payload = event_payload("restart", "rhel10-service-1")
        if payload != {"action": "restart", "service": "rhel10-service-1"}:
            raise SystemExit(f"{STEP}: unexpected payload {payload}")
        status, body = call_eda(
            DEFAULT_URL,
            DEFAULT_USERNAME,
            "self-check",
            "restart",
            "rhel10-service-1",
            dry_run=True,
        )
        if status != 0 or body != "dry-run":
            raise SystemExit(f"{STEP}: dry-run returned {status} {body}")
        print(f"{STEP}: self-check ok", flush=True)


    def main():
        import argparse

        parser = argparse.ArgumentParser(description="Step 3: call Event-Driven Ansible")
        parser.add_argument("--self-check", action="store_true")
        parser.add_argument("--dry-run", action="store_true")
        parser.add_argument("--url", default=DEFAULT_URL)
        parser.add_argument("--username", default=DEFAULT_USERNAME)
        parser.add_argument("--password", default=DEFAULT_PASSWORD)
        parser.add_argument("--action", default="restart")
        parser.add_argument("--service", default="")
        args = parser.parse_args()
        if args.self_check:
            self_check()
            return
        if args.dry_run:
            call_eda(args.url, args.username, args.password, args.action, args.service, dry_run=True)
            return
        if not args.password:
            raise SystemExit("Set EDA_EVENT_PASSWORD or pass --password")
        try:
            call_eda(args.url, args.username, args.password, args.action, args.service)
        except urllib.error.HTTPError as exc:
            raise SystemExit(f"{STEP}: failed HTTP {exc.code} {exc.reason}") from exc
        except (OSError, urllib.error.URLError) as exc:
            raise SystemExit(f"{STEP}: failed {exc}") from exc


    if __name__ == "__main__":
        main()
